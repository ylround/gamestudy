services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      MATHREALMS_DB: "/app/data/mathrealms.sqlite"
      MATHREALMS_SECRET: "${MATHREALMS_SECRET:?set MATHREALMS_SECRET in .env}"
    volumes:
      - mathrealms-data:/app/data
    expose:
      - "8787"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mathrealms-data:
